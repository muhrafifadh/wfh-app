# docs/18-tooling-and-git.md — every PR must pass all of these.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholder values so lib/env.ts validation passes during the build.
      # Not secrets: the build never contacts the backend.
      API_URL: http://localhost:8000/v1
      SESSION_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # The backend's committed contract. Fails when the backend changed its API
      # and this repo hasn't run `pnpm api:types` yet. The backend repo is
      # private, so this needs BACKEND_CONTRACT_TOKEN: a fine-grained token with
      # read-only "Contents" access to backend-boilerplate.
      - name: API types match backend main
        env:
          BACKEND_CONTRACT_TOKEN: ${{ secrets.BACKEND_CONTRACT_TOKEN }}
        run: |
          if [ -z "$BACKEND_CONTRACT_TOKEN" ]; then
            echo "::error::Missing secret BACKEND_CONTRACT_TOKEN (read access to backend-boilerplate). See docs/08-data-fetching.md."
            exit 1
          fi
          curl -fsSL \
            -H "Authorization: Bearer $BACKEND_CONTRACT_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/openapi.json" \
            "https://api.github.com/repos/muhrafifadh/backend-boilerplate/contents/openapi.json?ref=main"
          OPENAPI_SPEC="$RUNNER_TEMP/openapi.json" pnpm api:types:check

      # Includes src/**/contract.ts: Zod schemas must equal the generated API types
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
