# Weekly dependency updates. Minor and patch updates come as one grouped PR;
# majors come one by one, since they may need code or docs changes.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Majors we hold back on purpose; remove an entry once its blocker is gone
    ignore:
      # Must match the Node runtime in .nvmrc (24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TS 7.0 ships no compiler API (Nest CLI needs it, back in 7.1);
      # typescript-eslint supports < 6.1
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
