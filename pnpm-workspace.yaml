allowBuilds:
  "@scarf/scarf": false
  # Optional native speed-up for BullMQ; it falls back to plain JS
  msgpackr-extract: false
  esbuild: true
  "@prisma/engines": true
  prisma: true

# Security fixes for transitive deps (keep until upstream updates)
overrides:
  # Pulled in by the prisma CLI; we use Postgres, but keep the audit clean
  mysql2: ">=3.23.1"
  # Pulled in by @nestjs/platform-express (express)
  body-parser: ">=2.4.0"
  multer: ">=2.5.0"
  qs: ">=6.16.1"
  # Pulled in by ajv
  fast-uri: "^3.1.9"

auditConfig:
  ignoreGhsas:
    # deepmerge-ts 7.x, pinned exactly by @prisma/config. Only reached by the
    # prisma CLI loading prisma.config.ts (our own file), never at runtime.
    # Remove when Prisma ships deepmerge-ts >= 8.
    - GHSA-ggr8-5vv4-36mx
    # deepmerge 4.3.1 (low), via nestjs-zod. No patched release exists yet.
    # Remove when deepmerge >= 4.3.2 is published.
    - GHSA-gcqx-w48m-w2h4
