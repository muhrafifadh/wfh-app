allowBuilds:
  # Downloads the Sentry CLI binary, only needed to upload source maps
  # (SENTRY_AUTH_TOKEN). Set to true when you turn that on.
  "@sentry/cli": false
  sharp: false
  unrs-resolver: false

# Security fixes for transitive deps (keep until upstream updates)
overrides:
  # Pulled in by ajv (@hookform/resolvers, Sentry's webpack plugin)
  fast-uri: "^3.1.9"
